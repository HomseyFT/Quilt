[package]
name = "quilt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rustix = { version = "1.1.4", features = ["process", "thread", "mount", "fs", "pipe", "event", "runtime", "system", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
