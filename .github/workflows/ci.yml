name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      # --all-targets so the root and rootless test binaries are compiled here,
      # since neither can be run.
      - run: cargo clippy --all-targets -- -D warnings

      # Only the unit tier. The other two are gated on an environment variable
      # and would report a screen of passing tests that never ran.
      - run: cargo test --bins
